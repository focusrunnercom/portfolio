<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#6eff8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Head -->
    <circle cx="24" cy="13" r="7"/>
    <!-- Hair (short, technical) -->
    <path d="M17 11 C17 7, 20 5, 24 5 C28 5, 31 7, 31 11" stroke-width="1.2" opacity="0.5"/>
    <!-- Neck -->
    <line x1="20" y1="20" x2="20" y2="23"/>
    <line x1="28" y1="20" x2="28" y2="23"/>
    <!-- Shoulders -->
    <path d="M10 40 L10 32 C10 26, 16 23, 20 23 L28 23 C32 23, 38 26, 38 32 L38 40"/>
    <!-- Collar (open, technical) -->
    <path d="M20 23 L24 30 L28 23" stroke-width="1.2" opacity="0.5"/>
    <!-- Laptop (on lap) -->
    <!-- Screen -->
    <rect x="14" y="32" width="20" height="10" rx="1"/>
    <!-- Screen glow lines -->
    <line x1="17" y1="35" x2="26" y2="35" stroke-width="0.8" opacity="0.4"/>
    <line x1="17" y1="38" x2="30" y2="38" stroke-width="0.8" opacity="0.3"/>
    <!-- Base / keyboard -->
    <path d="M12 42 L14 40 L34 40 L36 42" stroke-width="1.2"/>
    <!-- Hinge line -->
    <line x1="14" y1="40" x2="34" y2="40" stroke-width="0.8" opacity="0.4"/>
    <!-- Code brackets floating -->
    <text x="3" y="12" fill="#6eff8a" stroke="none" font-size="8" font-family="monospace" opacity="0.3">{ }</text>
  </g>
</svg>
