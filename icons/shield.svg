<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#6eff8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Shield — precise heraldic shape -->
    <path d="M24 4 L42 10 L42 24 C42 34, 34 43, 24 45 C14 43, 6 34, 6 24 L6 10 Z"/>
    <!-- Inner shield border (depth) -->
    <path d="M24 8 L38 13 L38 24 C38 32, 32 39, 24 41 C16 39, 10 32, 10 24 L10 13 Z" opacity="0.25"/>
    <!-- Checkmark — bold, confident -->
    <polyline points="17,24 22,29 31,19" stroke-width="2.2"/>
    <!-- Shield rivets (top corners) -->
    <circle cx="12" cy="12" r="0.8" fill="#6eff8a" stroke="none" opacity="0.4"/>
    <circle cx="36" cy="12" r="0.8" fill="#6eff8a" stroke="none" opacity="0.4"/>
    <!-- Hex pattern (tech/security) -->
    <path d="M24 30 L27 32 L27 35 L24 37 L21 35 L21 32 Z" stroke-width="0.8" opacity="0.2"/>
  </g>
</svg>
