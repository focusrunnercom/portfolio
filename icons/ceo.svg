<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#6eff8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Head — precise circle -->
    <circle cx="24" cy="14" r="7"/>
    <!-- Hair (clean, professional) -->
    <path d="M17 12 C17 8, 20 5, 24 5 C28 5, 31 8, 31 12" stroke-width="1.2" opacity="0.5"/>
    <!-- Neck -->
    <line x1="20" y1="21" x2="20" y2="24"/>
    <line x1="28" y1="21" x2="28" y2="24"/>
    <!-- Shoulders / suit jacket -->
    <path d="M10 40 L10 32 C10 26, 16 24, 20 24 L28 24 C32 24, 38 26, 38 32 L38 40"/>
    <!-- Suit lapel (V-shape) -->
    <path d="M20 24 L24 34 L28 24" stroke-width="1.2" opacity="0.5"/>
    <!-- Tie -->
    <path d="M23 24 L22 32 L24 34 L26 32 L25 24" stroke-width="1" opacity="0.6"/>
    <!-- Collar -->
    <line x1="20" y1="24" x2="23" y2="24" stroke-width="1.2"/>
    <line x1="25" y1="24" x2="28" y2="24" stroke-width="1.2"/>
    <!-- Tie knot -->
    <path d="M23 24 L24 26 L25 24" stroke-width="1" opacity="0.5"/>
    <!-- Pocket square (subtle detail) -->
    <line x1="33" y1="30" x2="36" y2="30" stroke-width="0.8" opacity="0.3"/>
    <line x1="33" y1="30" x2="33" y2="33" stroke-width="0.8" opacity="0.3"/>
  </g>
</svg>
