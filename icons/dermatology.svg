<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#6eff8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Serum dropper / pipette — precise shape -->
    <path d="M24 6 C24 6, 16 18, 16 26 C16 32, 19 38, 24 38 C29 38, 32 32, 32 26 C32 18, 24 6, 24 6 Z"/>
    <!-- Inner liquid level -->
    <path d="M24 14 C24 14, 20 20, 20 24 C20 28, 22 31, 24 31 C26 31, 28 28, 28 24 C28 20, 24 14, 24 14 Z" opacity="0.35"/>
    <!-- Liquid surface line -->
    <path d="M18 24 C20 23, 22 25, 24 24 C26 23, 28 25, 30 24" stroke-width="1" opacity="0.4"/>
    <!-- Droplet falling from tip -->
    <path d="M24 40 C24.5 41, 24.5 43, 24 43.5 C23.5 43, 23.5 41, 24 40 Z" fill="#6eff8a" stroke="none" opacity="0.5"/>
    <!-- Skin layers (cross-section, bottom) -->
    <path d="M6 34 C10 32, 14 36, 18 34" stroke-width="1" opacity="0.3"/>
    <path d="M30 34 C34 32, 38 36, 42 34" stroke-width="1" opacity="0.3"/>
    <path d="M8 38 C12 36, 16 40, 20 38" stroke-width="0.8" opacity="0.2"/>
    <path d="M28 38 C32 36, 36 40, 40 38" stroke-width="0.8" opacity="0.2"/>
    <!-- Molecular dots (active ingredients) -->
    <circle cx="12" cy="14" r="1.2" fill="none" stroke-width="1" opacity="0.3"/>
    <circle cx="36" cy="14" r="1.2" fill="none" stroke-width="1" opacity="0.3"/>
    <circle cx="12" cy="14" r="0.4" fill="#6eff8a" stroke="none" opacity="0.3"/>
    <circle cx="36" cy="14" r="0.4" fill="#6eff8a" stroke="none" opacity="0.3"/>
  </g>
</svg>
