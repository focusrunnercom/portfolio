<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#6eff8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Head -->
    <circle cx="24" cy="13" r="7"/>
    <!-- Hair (professional, swept) -->
    <path d="M17 11 C17 7, 20 5, 24 5 C28 5, 31 7, 31 11" stroke-width="1.2" opacity="0.5"/>
    <!-- Neck -->
    <line x1="20" y1="20" x2="20" y2="23"/>
    <line x1="28" y1="20" x2="28" y2="23"/>
    <!-- Shoulders -->
    <path d="M10 40 L10 32 C10 26, 16 23, 20 23 L28 23 C32 23, 38 26, 38 32 L38 40"/>
    <!-- Blazer lapel (marketing professional) -->
    <path d="M20 23 L24 32 L28 23" stroke-width="1.2" opacity="0.5"/>
    <!-- Tie (slim, modern) -->
    <path d="M23 23 L22 29 L24 31 L26 29 L25 23" stroke-width="1" opacity="0.6"/>
    <!-- Growth chart (bar graph, top-right) -->
    <line x1="36" y1="8" x2="36" y2="16" stroke-width="1" opacity="0.4"/>
    <line x1="40" y1="6" x2="40" y2="16" stroke-width="1" opacity="0.5"/>
    <line x1="44" y1="4" x2="44" y2="16" stroke-width="1" opacity="0.6"/>
    <!-- Axis -->
    <line x1="34" y1="16" x2="46" y2="16" stroke-width="0.8" opacity="0.4"/>
    <!-- Trend arrow (upward) -->
    <polyline points="35,14 39,10 43,6" stroke-width="1.2" opacity="0.7"/>
    <polyline points="41,6 43,6 43,8" stroke-width="1" opacity="0.7"/>
  </g>
</svg>
