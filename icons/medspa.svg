<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#6eff8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Syringe — bold, unmistakable -->
  <rect x="4" y="18" width="22" height="12" rx="2"/>
  <!-- Plunger -->
  <line x1="4" y1="24" x2="1" y2="24"/>
  <line x1="1" y1="20" x2="1" y2="28"/>
  <!-- Needle -->
  <line x1="26" y1="24" x2="40" y2="24"/>
  <!-- Fluid marks -->
  <line x1="10" y1="18" x2="10" y2="30" stroke-width="1.5" opacity="0.4"/>
  <line x1="15" y1="18" x2="15" y2="30" stroke-width="1.5" opacity="0.4"/>
  <line x1="20" y1="18" x2="20" y2="30" stroke-width="1.5" opacity="0.4"/>
</svg>
