<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#6eff8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Syringe barrel with precise measurement lines -->
    <rect x="6" y="19" width="22" height="10" rx="1.5"/>
    <line x1="10" y1="19" x2="10" y2="29" opacity="0.3"/>
    <line x1="14" y1="19" x2="14" y2="29" opacity="0.4"/>
    <line x1="18" y1="19" x2="18" y2="29" opacity="0.5"/>
    <line x1="22" y1="19" x2="22" y2="29" opacity="0.6"/>
    <line x1="26" y1="19" x2="26" y2="29" opacity="0.7"/>
    <!-- Plunger rod -->
    <line x1="6" y1="24" x2="2" y2="24"/>
    <line x1="2" y1="20" x2="2" y2="28"/>
    <!-- Finger grip -->
    <line x1="4" y1="21" x2="4" y2="27" opacity="0.5"/>
    <!-- Needle hub -->
    <path d="M28 21 L32 21 L32 27 L28 27 Z"/>
    <!-- Needle -->
    <line x1="32" y1="24" x2="44" y2="24" stroke-width="1.2"/>
    <!-- Needle bevel tip -->
    <path d="M44 24 L42 22.5" stroke-width="1" opacity="0.6"/>
    <!-- Fluid level indicator -->
    <rect x="8" y="21" width="14" height="6" rx="0.5" fill="#6eff8a" opacity="0.08" stroke="none"/>
    <!-- Medical cross (top-right accent) -->
    <line x1="38" y1="10" x2="38" y2="16" stroke-width="1.4"/>
    <line x1="35" y1="13" x2="41" y2="13" stroke-width="1.4"/>
    <!-- Drop at needle tip -->
    <path d="M45 22 C45.5 23, 45.5 25, 45 25.5 C44.5 25, 44.5 23, 45 22 Z" fill="#6eff8a" opacity="0.4" stroke="none"/>
  </g>
</svg>
