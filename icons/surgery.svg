<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#6eff8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Scalpel blade — precise surgical shape -->
    <path d="M8 36 L28 16 L32 20 L12 40 Z"/>
    <!-- Blade edge highlight -->
    <line x1="10" y1="36" x2="30" y2="16" stroke-width="0.8" opacity="0.3"/>
    <!-- Blade spine (thicker back edge) -->
    <line x1="12" y1="40" x2="32" y2="20" stroke-width="2.2" opacity="0.2"/>
    <!-- Handle — cylindrical with grip lines -->
    <line x1="32" y1="16" x2="42" y2="6" stroke-width="2"/>
    <line x1="36" y1="20" x2="46" y2="10" stroke-width="2"/>
    <!-- Handle grip ridges -->
    <line x1="34" y1="13" x2="37" y2="16" stroke-width="0.8" opacity="0.4"/>
    <line x1="38" y1="9" x2="41" y2="12" stroke-width="0.8" opacity="0.4"/>
    <!-- Cut line (dashed, surgical precision) -->
    <path d="M6 28 L16 18" stroke-width="1" stroke-dasharray="2.5 2" opacity="0.4"/>
    <!-- Medical cross (bottom-right) -->
    <line x1="38" y1="38" x2="38" y2="44" stroke-width="1.4"/>
    <line x1="35" y1="41" x2="41" y2="41" stroke-width="1.4"/>
  </g>
</svg>
