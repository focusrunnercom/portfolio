<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#6eff8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Head profile — clean silhouette -->
    <path d="M14 36 C14 36, 11 28, 12 20 C13 14, 18 8, 24 8 C30 8, 35 14, 36 20 C37 28, 34 36, 34 36"/>
    <!-- Hairline — detailed arc -->
    <path d="M14 18 C16 12, 20 9, 24 9 C28 9, 32 12, 34 18" stroke-width="1.2" opacity="0.5"/>
    <!-- Hair strands (flowing) -->
    <path d="M16 20 C18 15, 22 12, 24 12 C26 12, 30 15, 32 20" stroke-width="1" opacity="0.35"/>
    <path d="M17 24 C19 19, 22 16, 24 16 C26 16, 29 19, 31 24" stroke-width="1" opacity="0.25"/>
    <!-- Transplant grid — precise dot matrix in hairline area -->
    <circle cx="18" cy="27" r="0.8" fill="#6eff8a" stroke="none" opacity="0.5"/>
    <circle cx="22" cy="27" r="0.8" fill="#6eff8a" stroke="none" opacity="0.5"/>
    <circle cx="26" cy="27" r="0.8" fill="#6eff8a" stroke="none" opacity="0.5"/>
    <circle cx="30" cy="27" r="0.8" fill="#6eff8a" stroke="none" opacity="0.5"/>
    <circle cx="20" cy="31" r="0.8" fill="#6eff8a" stroke="none" opacity="0.4"/>
    <circle cx="24" cy="31" r="0.8" fill="#6eff8a" stroke="none" opacity="0.4"/>
    <circle cx="28" cy="31" r="0.8" fill="#6eff8a" stroke="none" opacity="0.4"/>
    <!-- Neck -->
    <line x1="18" y1="36" x2="18" y2="42" stroke-width="1.2"/>
    <line x1="30" y1="36" x2="30" y2="42" stroke-width="1.2"/>
    <!-- Arrow (growth direction) -->
    <path d="M40 12 L40 20 M38 18 L40 20 L42 18" stroke-width="1" opacity="0.4"/>
  </g>
</svg>
