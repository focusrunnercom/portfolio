<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#6eff8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Scissors — bold, unmistakable haircut symbol -->
  <!-- Blade 1 -->
  <line x1="10" y1="38" x2="30" y2="10" stroke-width="3.5"/>
  <!-- Blade 2 -->
  <line x1="30" y1="38" x2="10" y2="10" stroke-width="3.5"/>
  <!-- Pivot -->
  <circle cx="20" cy="24" r="3"/>
  <!-- Handle loop 1 -->
  <path d="M10 38 C7 41, 4 42, 2 40"/>
  <!-- Handle loop 2 -->
  <path d="M30 38 C33 41, 36 42, 38 40"/>
</svg>
