    <line x1="32" y1="38" x2="30" y2="38" stroke-width="1.4"/>
    <line x1="44" y1="38" x2="46" y2="38" stroke-width="1.4"/>
    <line x1="33.8" y1="33.8" x2="32.3" y2="32.3" stroke-width="1.2"/>
    <line x1="42.2" y1="42.2" x2="43.7" y2="43.7" stroke-width="1.2"/>
    <line x1="42.2" y1="33.8" x2="43.7" y2="32.3" stroke-width="1.2"/>
    <line x1="33.8" y1="42.2" x2="32.3" y2="43.7" stroke-width="1.2"/>
