<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#6eff8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Terminal window frame -->
    <rect x="4" y="8" width="40" height="32" rx="2"/>
    <!-- Title bar separator -->
    <line x1="4" y1="14" x2="44" y2="14" opacity="0.3"/>
    <!-- Window controls (macOS style) -->
    <circle cx="9" cy="11" r="1.2" fill="#ff5c4d" stroke="none"/>
    <circle cx="13" cy="11" r="1.2" fill="#ffb547" stroke="none"/>
    <circle cx="17" cy="11" r="1.2" fill="#6eff8a" stroke="none"/>
    <!-- Prompt chevron -->
    <polyline points="10,20 15,25 10,30" stroke-width="1.8"/>
    <!-- Command line -->
    <line x1="18" y1="25" x2="28" y2="25" stroke-width="1.2" opacity="0.5"/>
    <!-- Blinking cursor block -->
    <rect x="30" y="22" width="3" height="6" fill="#6eff8a" stroke="none" opacity="0.8"/>
    <!-- Second line (output) -->
    <line x1="10" y1="34" x2="34" y2="34" stroke-width="1" opacity="0.3"/>
    <!-- Scanline effect (subtle) -->
    <line x1="6" y1="17" x2="42" y2="17" stroke-width="0.4" opacity="0.08"/>
    <line x1="6" y1="22" x2="42" y2="22" stroke-width="0.4" opacity="0.06"/>
    <line x1="6" y1="27" x2="42" y2="27" stroke-width="0.4" opacity="0.08"/>
    <line x1="6" y1="32" x2="42" y2="32" stroke-width="0.4" opacity="0.06"/>
    <line x1="6" y1="37" x2="42" y2="37" stroke-width="0.4" opacity="0.08"/>
  </g>
</svg>
