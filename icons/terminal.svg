<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#6eff8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Terminal window -->
  <rect x="4" y="6" width="40" height="36" rx="3"/>
  <!-- Title bar -->
  <line x1="4" y1="14" x2="44" y2="14" stroke-width="2" opacity="0.4"/>
  <!-- Prompt -->
  <polyline points="10,20 18,26 10,32" stroke-width="4"/>
  <!-- Cursor -->
  <rect x="22" y="22" width="6" height="8" fill="#6eff8a" stroke="none"/>
  <!-- Output line -->
  <line x1="10" y1="38" x2="30" y2="38" stroke-width="2" opacity="0.4"/>
</svg>
