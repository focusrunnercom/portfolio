<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#6eff8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Eye — almond shape with precision -->
    <path d="M4 24 C4 24, 14 12, 24 12 C34 12, 44 24, 44 24 C44 24, 34 36, 24 36 C14 36, 4 24, 4 24 Z"/>
    <!-- Iris ring -->
    <circle cx="24" cy="24" r="8"/>
    <!-- Iris detail (radial lines) -->
    <line x1="24" y1="17" x2="24" y2="20" opacity="0.3"/>
    <line x1="24" y1="28" x2="24" y2="31" opacity="0.3"/>
    <line x1="17" y1="24" x2="20" y2="24" opacity="0.3"/>
    <line x1="28" y1="24" x2="31" y2="24" opacity="0.3"/>
    <!-- Pupil -->
    <circle cx="24" cy="24" r="3.5" fill="#6eff8a" stroke="none" opacity="0.7"/>
    <!-- Pupil highlight -->
    <circle cx="22.5" cy="22.5" r="1" fill="#6eff8a" stroke="none" opacity="0.4"/>
    <!-- Laser beam (from top-right) -->
    <line x1="42" y1="6" x2="28" y2="18" stroke-width="1.4" opacity="0.7"/>
    <line x1="44" y1="4" x2="30" y2="16" stroke-width="0.8" opacity="0.3" stroke-dasharray="2 2"/>
    <!-- Laser impact point -->
    <circle cx="28" cy="18" r="1.5" fill="#6eff8a" stroke="none" opacity="0.5"/>
    <!-- Sparkle rays at impact -->
    <line x1="28" y1="18" x2="25" y2="15" stroke-width="0.8" opacity="0.4"/>
    <line x1="28" y1="18" x2="31" y2="15" stroke-width="0.8" opacity="0.4"/>
    <line x1="28" y1="18" x2="28" y2="14" stroke-width="0.8" opacity="0.4"/>
  </g>
</svg>
