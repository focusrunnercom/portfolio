<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#6eff8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Head -->
    <circle cx="24" cy="13" r="7"/>
    <!-- Hair (creative, slightly longer) -->
    <path d="M17 11 C16 7, 19 4, 24 4 C29 4, 32 7, 31 11" stroke-width="1.2" opacity="0.5"/>
    <!-- Neck -->
    <line x1="20" y1="20" x2="20" y2="23"/>
    <line x1="28" y1="20" x2="28" y2="23"/>
    <!-- Shoulders (casual shirt) -->
    <path d="M10 40 L10 32 C10 26, 16 23, 20 23 L28 23 C32 23, 38 26, 38 32 L38 40"/>
    <!-- Collar (open) -->
    <path d="M20 23 C22 26, 26 26, 28 23" stroke-width="1" opacity="0.4"/>
    <!-- Pen (held, angled) -->
    <line x1="30" y1="34" x2="42" y2="22" stroke-width="1.8"/>
    <!-- Pen tip -->
    <path d="M42 22 L44 20" stroke-width="1.2"/>
    <!-- Pen clip -->
    <line x1="32" y1="30" x2="34" y2="28" stroke-width="0.8" opacity="0.4"/>
    <!-- Text lines (floating, representing copy) -->
    <line x1="4" y1="26" x2="14" y2="26" stroke-width="1" opacity="0.3"/>
    <line x1="4" y1="30" x2="12" y2="30" stroke-width="1" opacity="0.25"/>
    <line x1="4" y1="34" x2="16" y2="34" stroke-width="1" opacity="0.3"/>
    <!-- Quotation mark (subtle) -->
    <text x="6" y="18" fill="#6eff8a" stroke="none" font-size="10" font-family="serif" opacity="0.2">"</text>
  </g>
</svg>
