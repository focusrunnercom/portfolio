<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#6eff8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Headphone band — smooth arc -->
    <path d="M8 28 C8 14, 40 14, 40 28"/>
    <!-- Band thickness (inner line) -->
    <path d="M10 28 C10 16, 38 16, 38 28" stroke-width="1" opacity="0.3"/>
    <!-- Left ear cup (detailed) -->
    <rect x="4" y="26" width="9" height="13" rx="2.5"/>
    <!-- Left cup inner pad -->
    <rect x="6" y="28" width="5" height="9" rx="1.5" opacity="0.3"/>
    <!-- Right ear cup -->
    <rect x="35" y="26" width="9" height="13" rx="2.5"/>
    <!-- Right cup inner pad -->
    <rect x="37" y="28" width="5" height="9" rx="1.5" opacity="0.3"/>
    <!-- Mic boom (from right cup) -->
    <path d="M44 39 C44 42, 40 44, 34 44"/>
    <!-- Mic capsule -->
    <rect x="31" y="42" width="5" height="4" rx="1.5" fill="#6eff8a" stroke="none" opacity="0.4"/>
    <!-- Mic grille lines -->
    <line x1="32" y1="43" x2="35" y2="43" stroke-width="0.5" opacity="0.6"/>
    <line x1="32" y1="44.5" x2="35" y2="44.5" stroke-width="0.5" opacity="0.5"/>
    <!-- Sound waves (radiating from mic) -->
    <path d="M28 43 C26 41, 24 41, 22 43" stroke-width="0.8" opacity="0.3"/>
    <path d="M26 43 C24 40, 20 40, 18 43" stroke-width="0.8" opacity="0.2"/>
  </g>
</svg>
