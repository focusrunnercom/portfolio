<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#6eff8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Inbox tray — 3D perspective -->
    <path d="M4 28 L12 28 L15 36 L33 36 L36 28 L44 28"/>
    <!-- Tray front wall -->
    <line x1="4" y1="28" x2="4" y2="40"/>
    <line x1="44" y1="28" x2="44" y2="40"/>
    <line x1="4" y1="40" x2="44" y2="40"/>
    <!-- Tray depth lines -->
    <line x1="4" y1="28" x2="4" y2="40" opacity="0.4"/>
    <line x1="44" y1="28" x2="44" y2="40" opacity="0.4"/>
    <!-- Envelope (sitting in tray) -->
    <rect x="14" y="16" width="20" height="12" rx="1"/>
    <!-- Envelope flap (V) -->
    <polyline points="14,16 24,24 34,16" stroke-width="1.2"/>
    <!-- Envelope bottom fold -->
    <line x1="14" y1="28" x2="20" y2="24" stroke-width="0.8" opacity="0.3"/>
    <line x1="34" y1="28" x2="28" y2="24" stroke-width="0.8" opacity="0.3"/>
    <!-- Down arrow (incoming mail) -->
    <line x1="24" y1="4" x2="24" y2="12"/>
    <polyline points="20,9 24,13 28,9" stroke-width="1.2"/>
    <!-- Motion lines (falling) -->
    <line x1="20" y1="5" x2="20" y2="8" stroke-width="0.8" opacity="0.3"/>
    <line x1="28" y1="5" x2="28" y2="8" stroke-width="0.8" opacity="0.3"/>
  </g>
</svg>
